[package]
name = "mandelbrot"
version = "0.1.0"
authors = ["gnzlbg <gonzalobg88@gmail.com>"]
build = "build.rs"
edition = "2018"

[dependencies]
rayon = "^1.0"
ispc = { version = "^1.0.4", optional = true }
structopt = { version = "0.3.0", features = ["color"] }
wide = "1.7.1"
pulp = { version = "0.22.3", features = ["x86-v4"] }
ndarray = { path = "../ndarray", default-features = false, features = ["std"] }
bytemuck = "1.20.0"

[build-dependencies]
ispc = { version = "^1.0.4", optional = true }

[[bin]]
name = "mandelbrot"
path = "src/main.rs"

[lib]
name = "mandelbrot_lib"
path = "src/lib.rs"

[features]
default = []
# std::simd arm; needs a nightly toolchain (`cargo +nightly ... --features nightly`).
nightly = ["pulp/nightly"]
